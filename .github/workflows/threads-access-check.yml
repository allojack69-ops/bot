name: Threads API access check

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Threads usernames separated by commas (without @ is fine)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check public Threads profile access
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_TARGETS: ${{ inputs.targets }}
          THREADS_API_BASE: https://graph.threads.net
          THREADS_API_VERSION: v1.0
        run: python scripts/check_threads_access.py
